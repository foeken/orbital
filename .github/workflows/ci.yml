name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # node:sqlite in db.js needs >= 22.5
          cache: npm
      # --ignore-scripts skips the postinstall: it downloads the 360 MB Electron binary (electron 44's install.js
      # ignores ELECTRON_SKIP_BINARY_DOWNLOAD) and then brands the bundle with plutil and codesign, macOS-only tools.
      # Neither the linter nor the checks touch the binary.
      - run: npm ci --ignore-scripts
      # Bun bundles the iPhone engine (ios/engine/build.js), which scripts/ios-engine-check.js builds and runs
      - uses: oven-sh/setup-bun@v2
      - run: npm run lint
      - run: npm run check
      # whole user flows in Chromium on the mock (scripts/flow-check.js, docs/TESTING.md); the runner image has Chrome
      - run: npm run flows
