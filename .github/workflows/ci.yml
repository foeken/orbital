name: CI

# A pull request and main are scanned for keys, tokens and real work content, and nothing else runs here: a change is
# checked on the machine that writes it before it merges (AGENTS.md, Pull requests), in about half a minute against
# minutes of runner setup, and everything runs on main a few times a day when it has moved (checks.yml). Nobody waits
# on a runner, a release's version bump included.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# a newer push to a pull request replaces its run; a merge to main gets a group of its own, its commit
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Keys, tokens and real work content (.gitleaks.toml) in the commits this pull request or push adds; the history
  # before them is not read again. gitleaks is a single binary, pinned and checked against its release's checksum.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .
