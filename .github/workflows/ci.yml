name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keys, tokens and real work content (.gitleaks.toml) in the commits this pull request or push adds; the history
  # before them is not read again. gitleaks is a single binary, pinned and checked against its release's checksum.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # node:sqlite in db.js needs >= 22.5
          cache: npm
      # --ignore-scripts skips the postinstall: it downloads the 360 MB Electron binary (electron 44's install.js
      # ignores ELECTRON_SKIP_BINARY_DOWNLOAD) and then brands the bundle with plutil and codesign, macOS-only tools.
      # Neither the linter nor the checks touch the binary.
      - run: npm ci --ignore-scripts
      # Bun bundles the iPhone engine (ios/engine/build.js), which scripts/ios-engine-check.js builds and runs
      - uses: oven-sh/setup-bun@v2
      - run: npm run lint
      - run: npm run check
      # whole user flows in Chromium on the mock (scripts/flow-check.js, docs/TESTING.md); the runner image has Chrome
      - run: npm run flows
