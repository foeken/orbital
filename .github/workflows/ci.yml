name: CI

# A second opinion on every pull request, beside the checks run where the change is written (AGENTS.md): the secrets
# scan, the desktop's lint, checks and user flows, and Android's build, tests and lint, at once, in about two to four
# minutes. None is a required check: a pull request merges once its local checks pass, and waits on no runner. The
# iPhone's UI tests stay local (npm run phones): GitHub's macOS runners took 12 to 22 minutes for what a Mac does in 8.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  desktop:
    # a draft is tested where it is written until it is ready (AGENTS.md)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # node:sqlite in db.js needs >= 22.5
          cache: npm
      # --ignore-scripts skips the postinstall: it downloads the 360 MB Electron binary (electron's install.js ignores
      # ELECTRON_SKIP_BINARY_DOWNLOAD) and then brands the bundle with plutil and codesign, macOS-only tools.
      # Neither the linter nor the checks touch the binary.
      - run: npm ci --ignore-scripts
      # Bun bundles the iPhone engine (ios/engine/build.js), which scripts/ios-engine-check.js builds and runs
      - uses: oven-sh/setup-bun@v2
      - run: npm run lint
      - run: npm run check
      # whole user flows in Chromium on the mock (scripts/flow-check.js, docs/TESTING.md); the runner image has Chrome
      - run: npm run flows

  # The Android app (android/): the shared module's tests, the screens among them drawn headless on the desktop target,
  # the app module's own JVM tests, its lint, and a debug build of the app. The journeys on a device
  # (connectedDebugAndroidTest) need an emulator and run locally (npm run phones).
  android:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # loro-crdt and friends for the engine bundle; the Electron download is not needed (as in desktop above)
      - run: npm ci --ignore-scripts
      # Bun bundles the engine into the app's assets (androidApp's orbitalAssets task runs ios/engine/build.js)
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # compileSdk 37 (android/gradle/libs.versions.toml), which the runner's own SDK may not have yet; the licences are
      # accepted by the action
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug --console=plain
        working-directory: android
