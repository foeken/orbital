name: CI

# Keys, tokens and real work content (.gitleaks.toml), on every pull request, a draft's too, and on every push to main.
# It is the only thing a draft runs: the checks run once it is ready (checks.yml into main and anything else, ready.yml
# into a developer's integration lane; AGENTS.md, Pull requests).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# a newer push to a pull request replaces its run; a merge to main gets a group of its own, its commit
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Keys, tokens and real work content (.gitleaks.toml) in the commits this pull request or push adds; the history
  # before them is not read again. gitleaks is a single binary, pinned and checked against its release's checksum.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .
