name: iOS

# The iPhone app's UI tests (ios/OrbitalUITests) on a simulator, on the invented -sample content. macOS minutes cost more
# than Linux ones, so this runs only when the app or the JS its engine bundles (ios/engine/index.js) changes.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'sdk/**', 'main/**', 'renderer/segments.js', 'package-lock.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'sdk/**', 'main/**', 'renderer/segments.js', 'package-lock.json', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts # loro-crdt for the engine bundle; the Electron download is not needed
      - uses: oven-sh/setup-bun@v2
      # the newest iOS runtime's first iPhone: the app needs iOS 26
      - name: Pick a simulator
        run: |
          id=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices; const rt=Object.keys(d).filter(k=>k.includes('iOS')).sort().reverse()[0]; console.log(d[rt].find(x=>x.name.startsWith('iPhone')).udid)")
          echo "SIM=$id" >> "$GITHUB_ENV"
      - name: UI tests
        working-directory: ios
        run: xcodebuild test -project Orbital.xcodeproj -scheme Orbital -destination "platform=iOS Simulator,id=$SIM" CODE_SIGNING_ALLOWED=NO
