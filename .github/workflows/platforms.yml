name: Platforms

# Every pull request says, for the desktop app, the iPhone, Android and the manual, whether it updated each or why it
# did not need to (AGENTS.md, Every platform; scripts/platform-check.js holds those lines to the diff). Its own
# workflow so that editing the description runs this again without running the rest of CI. Not a required check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    # Dependabot writes no Platforms section; every other author does, the dreetje-echo App that opens Orbital's own
    # pull requests included (a check on user.type skipped all of those)
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/platform-check.js --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
