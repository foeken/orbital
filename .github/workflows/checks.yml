name: Checks

# Every check, on main, every six hours when main has moved since the last scheduled run: the desktop's lint, checks and
# user flows, and the Android app. The iPhone's UI tests run on the Mac that writes a change and before every release
# (npm run phones, AGENTS.md): on GitHub's macOS runners they took a quarter of an hour and failed on their own.
# A pull request runs none of this on GitHub (ci.yml only scans it for secrets): it is checked on the machine that writes it before it merges (AGENTS.md, Pull requests). A failure
# of the desktop or Android opens one issue, "Scheduled checks failed", or adds the run to it, and the next good run
# closes it; while it is open a pull request cannot merge unless it is the fix (main-green.yml, required by main's
# ruleset).
# By hand, on any branch: gh workflow run checks.yml --ref <branch>
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # main-green.yml started again when the issue opens or closes
  issues: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # a scheduled run goes on only when main is not the commit the last scheduled run checked; one by hand always does
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.last.outputs.run }}
    steps:
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=""
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?event=schedule&status=completed&per_page=10" --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0].head_sha // ""')
          fi
          if [ "$last" = "$GITHUB_SHA" ]; then echo "main has not moved since $last"; echo run=false >> "$GITHUB_OUTPUT"; else echo run=true >> "$GITHUB_OUTPUT"; fi

  desktop:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # node:sqlite in db.js needs >= 22.5
          cache: npm
      # --ignore-scripts skips the postinstall: it downloads the 360 MB Electron binary (electron 44's install.js
      # ignores ELECTRON_SKIP_BINARY_DOWNLOAD) and then brands the bundle with plutil and codesign, macOS-only tools.
      # Neither the linter nor the checks touch the binary.
      - run: npm ci --ignore-scripts
      # Bun bundles the iPhone engine (ios/engine/build.js), which scripts/ios-engine-check.js builds and runs
      - uses: oven-sh/setup-bun@v2
      - run: npm run lint
      - run: npm run check
      # whole user flows in Chromium on the mock (scripts/flow-check.js, docs/TESTING.md); the runner image has Chrome
      - run: npm run flows

  # The Android app (android/): the shared module's tests, the screens among them drawn headless on the desktop target,
  # the app module's own JVM tests, its lint, and a debug build of the app. The journeys on a device
  # (connectedDebugAndroidTest) need an emulator and run by hand (npm run phones).
  android:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # loro-crdt and friends for the engine bundle; the Electron download is not needed (as in desktop above)
      - run: npm ci --ignore-scripts
      # Bun bundles the engine into the app's assets (androidApp's orbitalAssets task runs ios/engine/build.js)
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # compileSdk 37 (android/gradle/libs.versions.toml), which the runner's own SDK may not have yet; the licences are
      # accepted by the action
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug --console=plain
        working-directory: android

  # main's result as one issue: opened (or added to) when a job fails, closed when a later run passes them all
  report:
    needs: [moved, desktop, android]
    # !cancelled(), not always(): a run cancelled as a whole (a newer one in its concurrency group, or by hand) reports
    # nothing. always() kept this job running through the cancel (GitHub re-evaluates if: on cancelling, and always()
    # stays true), and BLOCKING below read the cancelled jobs as main failing. A job that times out ends only itself, so
    # it is still reported here, and blocks as before.
    if: ${{ !cancelled() && needs.moved.outputs.run == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          # Desktop and Android run on Linux and fail only for a reason, so their failure blocks every pull request but
          # its fix (main-green.yml reads "Scheduled checks failed").
          BLOCKING: ${{ contains(fromJSON('["failure","cancelled"]'), needs.desktop.result) || contains(fromJSON('["failure","cancelled"]'), needs.android.result) }}
          RESULTS: desktop ${{ needs.desktop.result }}, android ${{ needs.android.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          note="main at ${GITHUB_SHA::7}: $RESULTS. $RUN"
          # one issue per title: opened (or added to) on a failure, closed on the next run that passes; says whether it moved
          issue() {
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$1\" in:title" --json number,title --jq "map(select(.title == \"$1\"))[0].number // \"\"")
            if [ "$2" = true ]; then
              if [ -n "$open" ]; then gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$note"; return 1; fi
              gh issue create -R "$GITHUB_REPOSITORY" --title "$1" --body "$3 $note"
            elif [ -n "$open" ]; then gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Passing again. $note"
            else return 1; fi
          }
          # the blocking one opened or closed: every open pull request's main green status, again (an issue this token
          # opens or closes starts no workflow)
          if issue "Scheduled checks failed" "$BLOCKING" "Fix this before anything else lands: until it is closed, a pull request merges only if it says Fixes #<this issue> (main-green.yml)."; then
            gh workflow run main-green.yml -R "$GITHUB_REPOSITORY"
          fi
