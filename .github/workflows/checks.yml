name: Checks

# The full gate: the desktop's lint, checks and user flows, the Android app and the iPhone app's UI tests, on the
# exact head of every ready pull request that does not go into a developer's lane (AGENTS.md, Pull requests): into
# main, and into a stack layer. Into main the head must contain main as it is now, so the tree that passed is the tree a
# merge commit gives main; the verdict job, "gate", is the check main's ruleset requires, and it fails on a draft, a
# head behind main and any job skipped, cancelled or failed (scripts/gate.js). A pull request from a fork runs here
# with a read-only token and no secrets, as every job does: nothing here holds a credential.
# By hand, on any branch: gh workflow run checks.yml --ref <branch>
on:
  pull_request:
    branches-ignore: ['integration/**']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request replaces its run
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # where the pull request goes and whether its head contains main (scripts/gate.js route); refuses a draft without
  # failing, so the verdict below fails instead of reading as skipped
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.route.outputs.ok }}
      behind: ${{ steps.route.outputs.behind }}
      reason: ${{ steps.route.outputs.reason }}
      required: ${{ steps.route.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: route
        run: node scripts/gate.js route --workflow gate

  desktop:
    needs: route
    if: needs.route.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # the head itself, not GitHub's merge of it into the base: with main contained, it is the tree main gets
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # node:sqlite in db.js needs >= 22.5
          cache: npm
      # --ignore-scripts skips the postinstall: it downloads the 360 MB Electron binary (electron 44's install.js
      # ignores ELECTRON_SKIP_BINARY_DOWNLOAD) and then brands the bundle with plutil and codesign, macOS-only tools.
      # Neither the linter nor the checks touch the binary.
      - run: npm ci --ignore-scripts
      # Bun bundles the iPhone engine (ios/engine/build.js), which scripts/ios-engine-check.js builds and runs
      - uses: oven-sh/setup-bun@v2
      - run: npm run lint
      - run: npm run check
      # whole user flows in Chromium on the mock (scripts/flow-check.js, docs/TESTING.md); the runner image has Chrome
      - run: npm run flows

  # The Android app (android/): the shared module's tests, the screens among them drawn headless on the desktop target,
  # the app module's own JVM tests, its lint, and a debug build of the app. The journeys on a device
  # (connectedDebugAndroidTest) need an emulator and run by hand (npm run phones).
  android:
    needs: route
    if: needs.route.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # loro-crdt and friends for the engine bundle; the Electron download is not needed (as in desktop above)
      - run: npm ci --ignore-scripts
      # Bun bundles the engine into the app's assets (androidApp's orbitalAssets task runs ios/engine/build.js)
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # compileSdk 37 (android/gradle/libs.versions.toml), which the runner's own SDK may not have yet; the licences are
      # accepted by the action
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug --console=plain
        working-directory: android

  # The iPhone app's UI tests (ios/OrbitalUITests) on a simulator, on the invented -sample content
  ios:
    needs: route
    if: needs.route.outputs.ok == 'true'
    runs-on: macos-26
    # a run takes about 13 minutes: one that has not finished in 25 is stuck (a simulator that never launched the app once
    # held a run for over half an hour), and is ended rather than left for GitHub's six hours
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts # loro-crdt for the engine bundle; the Electron download is not needed
      - uses: oven-sh/setup-bun@v2
      # the newest iOS runtime's first iPhone: the app needs iOS 26. Booting it in the background while the app builds was
      # tried (#702) and made the build six times slower: the runner has few cores, and the boot takes them
      - name: Pick a simulator
        run: |
          id=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices; const rt=Object.keys(d).filter(k=>k.includes('iOS')).sort().reverse()[0]; console.log(d[rt].find(x=>x.name.startsWith('iPhone')).udid)")
          echo "SIM=$id" >> "$GITHUB_ENV"
      - name: UI tests
        working-directory: ios
        # A test that hangs (most often the app launch, "Timed out while launching application via Xcode") is ended after
        # three minutes, and a failed test runs once more on its own, so a flaky launch costs a test's retry, not a whole
        # new run. The index store is only for the editor.
        run: >-
          xcodebuild test -project Orbital.xcodeproj -scheme Orbital -destination "platform=iOS Simulator,id=$SIM"
          -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300
          -retry-tests-on-failure -test-iterations 2
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

  # The one check a ruleset requires: always runs, and passes only when the route said ok, the head contains main
  # (into main) and every job above succeeded on it
  gate:
    needs: [route, desktop, android, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/gate.js
          sparse-checkout-cone-mode: false
      - run: node scripts/gate.js verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
