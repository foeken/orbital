[package]
name = "orbital-gpui"
version = "0.0.1"
edition = "2024"
publish = false
description = "Spike: Orbital's desktop window drawn with GPUI over the JavaScript engine"

[dependencies]
# runtime_shaders: the Metal shaders compile when the app starts, so building needs no Metal Toolchain download.
# No wayland/x11: this spike is macOS only.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
futures = "0.3"
libc = "0.2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

# gpui with Orbital's patches (patches/), put in vendor/ by vendor.sh, which bundle.sh runs first
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[profile.dev.package."*"]
opt-level = 2
