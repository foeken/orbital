# The Android app's versions (docs/ANDROID.md has the research behind them). They are not that page's first pick (AGP
# 9.3.1, Kotlin 2.4.20, webkit 1.17.1), which was for a plain KMP module: the screens here are Compose Multiplatform,
# and this is the set it was first built and tested with on Gradle 9.6 and this Mac's JDK, Compose 1.10.3 with Kotlin
# 2.3.20, its Material 3 and AGP 9.4.0. webkit stays at 1.14.0, the last release before
# setRequestedWithHeaderOriginAllowList (EngineWeb) became a deprecated no-op. Move them together, against Kotlin's
# and Compose Multiplatform's compatibility tables, rather than one alone.
[versions]
agp = "9.4.0"
kotlin = "2.3.20"
compose = "1.10.3"
# Compose Multiplatform 1.10.3 pins Material 3 to this one
composeMaterial3 = "1.10.0-alpha05"
materialIcons = "1.7.3"
activity = "1.13.0"
webkit = "1.14.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.7.1"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
uiautomator = "2.3.0"
# 3.5 (what the Compose test rule pulls in) reaches for InputManager.getInstance, which API 37 no longer has
espresso = "3.7.0"
composeUiTestAndroid = "1.10.6"
compileSdk = "37"
minSdk = "29"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIcons" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-ui-test-junit4-android = { module = "androidx.compose.ui:ui-test-junit4-android", version.ref = "composeUiTestAndroid" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUiTestAndroid" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
