<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Quick add</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="quick-add.css">
</head>
<body class="quick">
<div id="qpanel" class="qpanel">
  <input id="qtitle" type="text" placeholder="New task" autocomplete="off" spellcheck="false">
  <div class="qrow">
    <div id="qmeeting" class="qmeeting">Checking for an active meeting…</div>
    <button id="qassignee" class="qassignee">Assign to…</button>
  </div>
  <textarea id="qprompt" class="qprompt" placeholder="What should the agent do?" hidden></textarea>
  <div id="qerror" class="qerror" hidden></div>
  <div id="qchooser" class="qchooser" hidden>
    <input id="qfilter" type="text" placeholder="Find a person" autocomplete="off" spellcheck="false">
    <div id="qlist" class="qlist"></div>
  </div>
  <div class="qhint"><span>⌘↵ create</span><span>⇥ assignee</span><span>esc close</span></div>
</div>
<script src="icons.js"></script>
<script src="quick-add.js"></script>
</body>
</html>
