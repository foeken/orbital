<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Orbital</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="building"><!-- the loader is up until the first page lands (renderer/render.js) -->
<div class="app">
<header class="titlebar">
  <nav id="crumbs" class="crumbs"></nav>
  <div class="navbtns">
    <button id="navBack" class="navbtn" tabindex="-1"></button>
    <button id="navFwd" class="navbtn" tabindex="-1"></button>
    <button id="pillsToggle" class="navbtn" tabindex="-1" hidden></button>
    <button id="navTable" class="navbtn" tabindex="-1" hidden></button>
    <button id="navCleanup" class="navbtn" tabindex="-1" hidden></button>
    <button id="navRefresh" class="navbtn" tabindex="-1" hidden></button>
    <button id="railToggle" class="navbtn" tabindex="-1" hidden></button>
  </div>
  <div id="pagehead" class="pagehead"><input id="titleCheck" type="checkbox" class="check" tabindex="-1" hidden><h1 id="title">Tana</h1></div>
  <div id="taskInfo" class="meta" hidden></div>
  <div id="error" class="error" hidden><span id="errorText"></span><button id="errorLogin" hidden>Log in to Tana</button></div>
</header>
<div id="pills" class="pills" hidden></div>
<div id="filterRow" class="filter" hidden>
  <input id="filter" type="text" placeholder="Filter" autocomplete="off" spellcheck="false">
  <button id="clear" class="clear" title="Clear" tabindex="-1">×</button>
</div>
<main class="scroll">
  <div id="loginBox" class="login" hidden><p>Orbital is a keyboard-first outliner for your Tana workspace. Log in with your Tana account to start.</p><button id="login">Log in to Tana</button></div>
  <div id="fields" class="fields" hidden></div><!-- in the scroll area: a page's fields scroll with its outline, under the header -->
  <div id="outline" class="outline"></div>
  <div id="filtered" class="filtered"></div>
</main>
<div id="chatQuestion" class="qcard" tabindex="-1" role="group" aria-label="Tana's questions" hidden></div><!-- Tana's questions, in the composer's place (renderer/chat.js) -->
<div id="composer" class="composer empty" hidden><span id="composerSkill" class="composer-skill" title="The skill this message runs · Backspace removes it" hidden></span><div id="composerText" class="ctext" contenteditable="plaintext-only" role="textbox" aria-multiline="true" aria-label="Message" data-placeholder="Ask Tana · @ links · / runs a skill" spellcheck="true"></div><span id="composerMode" class="composer-mode" title="Tab in an empty message switches" hidden></span><button id="composerSend" class="composer-send" tabindex="-1" title="Send ↩" aria-label="Send">↑</button></div><!-- under an open chat, outside the scroll so it stays at the window's bottom (renderer/chat.js) -->
<div id="skeleton" class="skeleton" aria-hidden="true"><canvas></canvas></div>
</div>
<div id="railGrip" class="railgrip" title="Drag to resize" hidden></div>
<aside id="rail" class="rail" hidden></aside>
<div id="toolbar" class="toolbar" role="toolbar" aria-label="Formatting" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="palette" class="palette" hidden>
  <div class="card">
    <input id="paletteInput" type="text" placeholder="Run a command" autocomplete="off" spellcheck="false">
    <textarea id="paletteText" class="ptext" rows="4" placeholder="What should the agent do?" aria-label="What should the agent do?" autocomplete="off" spellcheck="false" hidden></textarea>
    <div id="paletteList" class="list"></div>
  </div>
</div>
<div id="recorder" class="recorder" hidden>
  <div class="card">
    <div class="rlabel">Recording keyboard shortcut for:</div>
    <h2 id="recTitle"></h2>
    <div class="rbox"><span id="recKeys" class="keys"></span><span class="dot"></span></div>
    <div id="recWarn" class="rwarn" hidden></div>
    <div class="rbuttons">
      <button id="recReset" class="button">Reset</button>
      <span class="spacer"></span>
      <button id="recCancel" class="button">Cancel</button>
      <button id="recSave" class="button" disabled>Save</button>
    </div>
  </div>
</div>
<script src="icons.js"></script>
<!-- one classic script per concern, in dependency order: every file shares the same global scope -->
<script src="renderer/prefs.js"></script>
<script src="renderer/theme.js"></script>
<script src="renderer/motion.js"></script>
<script src="renderer/loading.js"></script>
<script src="renderer/mock.js"></script>
<script src="renderer/segments.js"></script>
<script src="renderer/state.js"></script>
<script src="renderer/nodes.js"></script>
<script src="renderer/rail.js"></script>
<script src="renderer/render.js"></script>
<script src="renderer/edit.js"></script>
<script src="renderer/table.js"></script>
<script src="renderer/drag.js"></script>
<script src="renderer/upload.js"></script>
<script src="renderer/select.js"></script>
<script src="renderer/views.js"></script>
<script src="renderer/tasks.js"></script>
<script src="renderer/access.js"></script>
<script src="renderer/pills.js"></script>
<script src="renderer/document.js"></script>
<script src="renderer/meeting.js"></script>
<script src="renderer/toolbar.js"></script>
<script src="renderer/events.js"></script>
<script src="renderer/palette.js"></script>
<script src="renderer/agent.js"></script>
<script src="renderer/fields.js"></script>
<script src="renderer/inbox.js"></script>
<script src="renderer/proposals.js"></script>
<script src="renderer/timeline.js"></script>
<script src="renderer/chat.js"></script>
<script src="renderer/presence.js"></script>
<script src="renderer/overlays.js"></script>
<script src="renderer/app.js"></script>
</body>
</html>
