<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>Tana</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="titlebar">
  <nav id="crumbs" class="crumbs" hidden></nav>
  <h1 id="title">Tana</h1>
  <div id="error" class="error" hidden></div>
</header>
<div id="filterRow" class="filter" hidden>
  <input id="filter" type="text" placeholder="Filter" autocomplete="off" spellcheck="false">
  <button id="clear" class="clear" title="Clear" tabindex="-1">×</button>
</div>
<main class="scroll">
  <div id="loginBox" class="login" hidden><button id="login">Log in to Tana</button></div>
  <div id="outline" class="outline"></div>
  <div id="filtered" class="filtered"></div>
</main>
<div id="palette" class="palette" hidden>
  <div class="card">
    <input id="paletteInput" type="text" placeholder="Search or run a command" autocomplete="off" spellcheck="false">
    <div id="paletteList" class="list"></div>
  </div>
</div>
<script src="icons.js"></script>
<script src="renderer.js"></script>
</body>
</html>
