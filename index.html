<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>Tana</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="titlebar">
  <nav id="crumbs" class="crumbs" hidden></nav>
  <h1 id="title">Tasks</h1>
</header>
<div id="filterRow" class="filter">
  <input id="filter" type="text" placeholder="Filter" autocomplete="off" spellcheck="false">
  <button id="clear" class="clear" title="Clear" tabindex="-1">×</button>
</div>
<main class="scroll">
  <div id="outline" class="outline"></div>
  <div id="filtered" class="filtered"></div>
</main>
<footer class="status">
  <span id="statusText"></span>
  <span class="spacer"></span>
  <button id="login" hidden>Log in to Tana</button>
</footer>
<script src="renderer.js"></script>
</body>
</html>
